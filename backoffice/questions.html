  <main class="wrap bo-main">
    <div class="bo-section-head">
      <h2>Standard questions</h2>
      <p class="bo-section-note">
        The question bank every new invitation starts from, and what the public
        <a class="bracket-link" href="../questions" target="_blank" rel="noopener">[ questions page ]</a> shows.
        Changing it doesn't touch people who are already invited - each of them has their own copy, which you can edit from their candidate page.
      </p>
    </div>

    <div id="bo-q-mount"></div>

    <div class="bo-savebar">
      <button type="button" class="btn btn-primary" id="bo-q-save">Save standard questions</button>
      <button type="button" class="btn btn-ghost" id="bo-q-reset">Reset to built-in defaults</button>
      <span class="bo-save-status" id="bo-q-status"></span>
    </div>
  </main>

  <script src="../assets/questions-default.js?v=2"></script>
  <script src="../assets/backoffice.js?v=15"></script>
  <script src="../assets/backoffice-questions.js?v=3"></script>
  <script>
    (async () => {
      if (!(await boCurrentGuard())) return;
      const status = document.getElementById("bo-q-status");
      let editor;
      try {
        const bank = await (await fetch("/api/question-bank")).json();
        editor = boQuestionEditor(document.getElementById("bo-q-mount"), bank.sections, () => { status.textContent = "Unsaved changes"; });
      } catch (err) {
        editor = boQuestionEditor(document.getElementById("bo-q-mount"), INTERVIEW_SECTIONS, () => { status.textContent = "Unsaved changes"; });
      }
      document.getElementById("bo-q-save").addEventListener("click", async () => {
        status.textContent = "Saving…";
        const resp = await fetch("/api/question-bank", {
          method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
          body: JSON.stringify({ sections: editor.getSections() })
        });
        if (resp.ok) { editor.setSections((await resp.json()).sections); status.textContent = "Saved ✓"; }
        else status.textContent = "Couldn't save - check that every section has a title.";
      });
      document.getElementById("bo-q-reset").addEventListener("click", () => {
        if (!window.confirm("Replace the editor contents with the built-in default questions? (Nothing is saved until you press Save.)")) return;
        editor.setSections(INTERVIEW_SECTIONS);
        status.textContent = "Unsaved changes";
      });
    })();
  </script>
</body>
