<body class="light">
  <nav class="nav bo-nav">
    <div class="nav-inner">
      <a class="logo" href="/"><span class="logo-mark"></span><span class="logo-word" role="img" aria-label="Product Moat"></span> <span class="bo-nav-tag">Backoffice</span></a>
      <div class="bo-subnav">
        <a href="candidates" data-tip="Candidates" aria-label="Candidates"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg></a>
        <a href="questions" data-tip="Questions" aria-label="Questions"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></a>
        <a href="map-submissions" data-tip="Map submissions" aria-label="Map submissions"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></a>
        <a href="users" data-tip="All users" aria-label="All users"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></a>
        <a href="calendar" class="bo-subnav-active" data-tip="Calendar" aria-label="Calendar"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
      </div>
      <div class="bo-nav-right">
        <span class="bo-user" id="bo-user"></span>
        <button class="btn btn-ghost bo-logout" id="bo-logout">Log out</button>
      </div>
    </div>
  </nav>

  <header class="cal-hero">
    <div class="wrap">
      <div class="eyebrow">The publishing calendar</div>
      <div class="cal-years" id="cal-years" role="group" aria-label="Year"></div>
      <div class="cal-legend">
        <div class="cal-legend-item"><span class="cal-swatch cal-swatch-published"></span>Published</div>
        <div class="cal-legend-item"><span class="cal-swatch cal-swatch-planned"></span>Scheduled / estimated</div>
        <div class="cal-legend-item"><span class="cal-swatch cal-swatch-current"></span>Current week</div>
        <div class="cal-legend-item"><span class="cal-swatch cal-swatch-open"></span>Open - still available</div>
        <div class="cal-legend-item"><span class="cal-swatch cal-swatch-gap"></span>No issue published</div>
      </div>
      <p class="cal-note" id="cal-note"></p>
    </div>
  </header>

  <main>
    <div class="wrap-cal" id="cal-board"></div>
  </main>

  <script src="../assets/site.js?v=edc46884"></script>
  <script src="../assets/backoffice.js?v=2a6af641"></script>
  <script src="../assets/backoffice-candidates.js?v=751dfa92"></script>
  <script src="../assets/backoffice-calendar.js?v=4ff3815a"></script>
  <script>initBackofficeCalendar();</script>
</body>
</html>
